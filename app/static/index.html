<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Invoice Reader</title>
<style>
  :root { --bg:#f5f7f9; --card:#fff; --ink:#1b2430; --muted:#5d6977; --line:#dde3ea;
          --accent:#0b6e7f; --ok:#1d7a3e; --ok-bg:#e3f4e8; --warn:#9a5b00; --warn-bg:#fbf0df; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  p.sub { margin: 0 0 24px; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 20px; }
  form { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 9px 16px; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  #msg { color: var(--muted); }
  .result dl { display: grid; grid-template-columns: 160px 1fr; gap: 6px 12px; margin: 10px 0; }
  .result dt { color: var(--muted); }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; }
  .valid { background: var(--ok-bg); color: var(--ok); }
  .needs_review { background: var(--warn-bg); color: var(--warn); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  ul.issues { margin: 6px 0 0; color: var(--warn); }
</style>
</head>
<body>
<main>
  <h1>Smart Invoice Reader</h1>
  <p class="sub">Upload an invoice (PDF, PNG or JPG). The app reads it with OCR, extracts the key fields with an LLM, and checks them with validation rules.</p>

  <section class="card">
    <form id="upload-form">
      <input type="file" id="file" name="file" accept=".pdf,.png,.jpg,.jpeg" required>
      <button type="submit" id="btn">Upload and extract</button>
      <span id="msg"></span>
    </form>
    <div id="result" class="result"></div>
  </section>

  <section class="card">
    <h2 style="margin-top:0">Processed invoices</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>File</th><th>Invoice no.</th><th>Date</th><th>Vendor</th><th>Total</th><th>Status</th><th>Method</th></tr></thead>
        <tbody id="rows"><tr><td colspan="8">No invoices yet.</td></tr></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const form = document.getElementById("upload-form");
const msg = document.getElementById("msg");
const btn = document.getElementById("btn");
const result = document.getElementById("result");

// escape text before putting it into HTML, so file contents can't inject markup
function esc(value) {
  return String(value ?? "—").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function money(inv) {
  const t = inv.data.total_amount;
  return t == null ? "—" : `${inv.data.currency || ""} ${t.toFixed(2)}`.trim();
}

function showResult(inv) {
  const issues = inv.issues.length
    ? `<ul class="issues">${inv.issues.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : "";
  result.innerHTML = `
    <dl>
      <dt>Status</dt><dd><span class="pill ${inv.status}">${inv.status.replace("_", " ")}</span></dd>
      <dt>Invoice number</dt><dd>${esc(inv.data.invoice_number)}</dd>
      <dt>Date</dt><dd>${esc(inv.data.invoice_date)}</dd>
      <dt>Vendor</dt><dd>${esc(inv.data.vendor_name)}</dd>
      <dt>Total</dt><dd>${esc(money(inv))}</dd>
      <dt>Line items</dt><dd>${inv.data.line_items.length}</dd>
      <dt>Extracted by</dt><dd>${inv.method === "llm" ? "LLM (Gemini)" : "Regex rules"}</dd>
    </dl>${issues}`;
}

async function loadTable() {
  const res = await fetch("/api/invoices");
  const list = await res.json();
  const rows = document.getElementById("rows");
  if (!list.length) { rows.innerHTML = '<tr><td colspan="8">No invoices yet.</td></tr>'; return; }
  rows.innerHTML = list.map(inv => `
    <tr><td>${inv.id}</td><td>${esc(inv.filename)}</td><td>${esc(inv.data.invoice_number)}</td>
    <td>${esc(inv.data.invoice_date)}</td><td>${esc(inv.data.vendor_name)}</td><td>${esc(money(inv))}</td>
    <td><span class="pill ${inv.status}">${inv.status.replace("_", " ")}</span></td><td>${inv.method}</td></tr>`).join("");
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const body = new FormData();
  body.append("file", document.getElementById("file").files[0]);
  btn.disabled = true; msg.textContent = "Reading the invoice…"; result.innerHTML = "";
  try {
    const res = await fetch("/api/invoices", { method: "POST", body });
    const json = await res.json();
    if (!res.ok) throw new Error(json.detail || "Upload failed");
    msg.textContent = "Done.";
    showResult(json);
    loadTable();
  } catch (error) {
    msg.textContent = error.message;
  } finally {
    btn.disabled = false;
  }
});

loadTable();
</script>
</body>
</html>
